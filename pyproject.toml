[project]
name = "audio-qa"
version = "0.1.0"
description = "Local synthetic-voice QA pipeline: course folder in, reconciliation packet out."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    # CGT courses have no PowerPoint at all; their script is a Word document in
    # the BUS Writing Template. Not an extra, because half the deliveries need
    # it and a missing script parser is not a degraded mode.
    "python-docx>=1.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "num2words>=0.5.13",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
# The CUDA runtime libraries ctranslate2 needs, as its own extra so a
# CPU only machine does not pull most of a gigabyte it will never use.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
web = ["streamlit>=1.36"]
dev = ["pytest>=8.0"]

[project.scripts]
qa-setup = "qa.setup:main"
qa-run = "qa.cli:main"
qa-web = "qa.web.launch:main"
qa-new-course = "qa.new_course:main"
qa-terms = "qa.terms:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa"]
